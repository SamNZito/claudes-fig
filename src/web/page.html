<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fig live log</title>
<style>
:root {
  --bg: #f3eee6; --card: #fbf9f4; --ink: #1d1b18; --muted: #6b665e; --line: #e2dbcf;
  --green: #1f6b45; --green-bg: #e3f0e7; --on-green: #fff; --red: #a33a2b; --red-bg: #f6e3df; --amber: #8a5a00; --amber-bg: #f7ecd4;
  --chip: #ece5d9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614; --card: #201f1c; --ink: #ece8e1; --muted: #a39d92; --line: #34312c;
    --green: #6cc596; --green-bg: #1d2e24; --on-green: #10241a; --red: #f08c7c; --red-bg: #3a221e; --amber: #e5b65c; --amber-bg: #3a2f19;
    --chip: #2c2a26;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 40px; }
header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.logo { width: 44px; height: 44px; border-radius: 50%; background: var(--green); display: grid; place-items: center; color: var(--on-green); font-size: 18px; flex: none; }
h1 { font: 600 30px/1 Georgia, "Times New Roman", serif; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
.who { margin-left: auto; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--chip); padding: 5px 9px; border-radius: 999px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">((•))</div>
    <div><div class="sub">Discord voice</div><h1>Fig</h1></div>
    <span class="who" id="who" title="The copy of Fig this page is reading">…</span>
  </header>
  <!--VIEWER-->
</div>
</body>
</html>
